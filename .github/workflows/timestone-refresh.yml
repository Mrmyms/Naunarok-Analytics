name: Timestone FTC Refresh

on:
  workflow_dispatch:
    inputs:
      event_code:
        description: "Código de evento para las pestañas (ej. MXTLQ)"
        required: true
        default: "MXTLQ"
        type: string
      ftcscout_code:
        description: "Código oficial en FTCScout (opcional si coincide con event_code)"
        required: false
        default: ""
        type: string
      season:
        description: "Temporada FTCScout"
        required: false
        default: "2026"
        type: string

concurrency:
  group: timestone-refresh-${{ inputs.event_code }}
  cancel-in-progress: false

jobs:
  run-timestone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q tests/test_timestone.py

      - name: Run Timestone simulation & upload to Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          if [ -z "$GOOGLE_CLIENT_EMAIL" ] || [ -z "$GOOGLE_PRIVATE_KEY" ]; then
            echo "::error::Faltan secretos GOOGLE_CLIENT_EMAIL o GOOGLE_PRIVATE_KEY en GitHub Actions."
            exit 1
          fi
          ARGS=(--event "${{ inputs.event_code }}" --season "${{ inputs.season }}")
          if [ -n "${{ inputs.ftcscout_code }}" ]; then
            ARGS+=(--ftcscout-code "${{ inputs.ftcscout_code }}")
          fi
          python timestone_ftc_2026_2027_v2.py "${ARGS[@]}"

